version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: joao_maria_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: joao_maria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
