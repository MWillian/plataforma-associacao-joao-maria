name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        working-directory: client
        run: npm ci

      - name: Executar lint
        working-directory: client
        run: npm run lint

      - name: Gerar build
        working-directory: client
        run: npm run build

  server:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/association_ci?schema=public

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        working-directory: server
        run: npm ci

      - name: Validar schema do Prisma
        working-directory: server
        run: npx prisma validate

      - name: Executar testes
        working-directory: server
        run: npm test
